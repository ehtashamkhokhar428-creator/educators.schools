<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Student Database</title>
    
    <!-- Firebase Standard Libraries (Real-time sync ke liye zaroori hain) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); width: 320px; margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #333; text-align: center; }
        input { padding: 12px; width: 92%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        #statusMessage { margin-top: 10px; font-weight: bold; font-size: 14px; text-align: center; color: blue; }
        
        /* Live List ka Style */
        .list-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); width: 320px; }
        .student-item { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-left: 5px solid #28a745; border-radius: 4px; font-size: 15px; }
    </style>
</head>
<body>

    <!-- 1. Data Entry Form -->
    <div class="container">
        <h2>Add Student</h2>
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="text" id="studentClass" placeholder="Class">
        <button id="saveBtn">Save to Firebase</button>
        <div id="statusMessage">Connecting to database...</div>
    </div>

    <!-- 2. Live Data Display List -->
    <div class="list-container">
        <h3>Live Students List</h3>
        <div id="studentsList">Loading live data...</div>
    </div>

<script>
    // Aapke school project ki config details
    const firebaseConfig = {
        apiKey: "AIzaSyBgWwOgBszcVtUm9BZEi2jDF-FM-QuHtIU",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://school-df259-default-rtdb.firebaseio.com",
        projectId: "school-df259",
        storageBucket: "school-df259.firebasestorage.app",
        messagingSenderId: "1058157464113",
        appId: "1:1058157464113:web:43bb8fab8f96a7fb16e310",
        measurementId: "G-B6SSH8K351"
    };

    // Firebase Initialize karein
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const studentsRef = database.ref('students');

    const nameInput = document.getElementById('studentName');
    const classInput = document.getElementById('studentClass');
    const saveButton = document.getElementById('saveBtn');
    const statusMessage = document.getElementById('statusMessage');
    const studentsListDiv = document.getElementById('studentsList');

    statusMessage.innerText = "Database Connected! Form Ready.";

    // --- STEP A: Data Save Karne Ka Code ---
    saveButton.addEventListener('click', function() {
        const name = nameInput.value.trim();
        const sClass = classInput.value.trim();

        if(name === "" || sClass === "") {
            statusMessage.style.color = "red";
            statusMessage.innerText = "Meharbani karke dono fields bharein!";
            return;
        }

        // Realtime database mein data bhejhein
        studentsRef.child(name).set({
            studentName: name,
            studentClass: sClass
        })
        .then(() => {
            statusMessage.style.color = "green";
            statusMessage.innerText = "✔ Saved successfully!";
            nameInput.value = "";
            classInput.value = "";
        })
        .catch((error) => {
            statusMessage.style.color = "red";
            statusMessage.innerText = "❌ Error: " + error.message;
        });
    });

    // --- STEP B: Real-time Live Sync Listener ---
    // Jab bhi database mein koi data badlega, yeh code sabhi open browsers par live update dikhayega
    studentsRef.on('value', function(snapshot) {
        studentsListDiv.innerHTML = ""; // Purani list saaf karein
        
        if (snapshot.exists()) {
            snapshot.forEach(function(childSnapshot) {
                const data = childSnapshot.val();
                
                // Screen par naya element dikhane ke liye
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `<strong>Name:</strong> ${data.studentName} <br> <strong>Class:</strong> ${data.studentClass}`;
                
                studentsListDiv.appendChild(item);
            });
        } else {
            studentsListDiv.innerText = "No students found in database.";
        }
    });
</script>
</body>
</html>
